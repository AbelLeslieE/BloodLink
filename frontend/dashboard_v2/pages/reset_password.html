<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodLink | Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/static/dashboard_v2/css/login.css">
</head>
<body>
    <main class="login-container">
        <section class="left-section" aria-hidden="true"></section>
        <section class="login-section">
            <div class="login-card password-reset-card">
                <div class="avatar"><i class="fa-solid fa-key"></i></div>
                <h2 id="resetTitle">Forgot password?</h2>
                <p id="resetSubtitle" class="subtitle">Enter your donor account email and we will send a secure reset link.</p>

                <form id="passwordResetRequestForm" novalidate>
                    <label for="resetEmail">Email address</label>
                    <div class="input-group"><i class="fa-regular fa-envelope"></i><input id="resetEmail" type="email" autocomplete="email" placeholder="you@example.com" required></div>
                    <p id="resetRequestMessage" class="message" role="status" aria-live="polite"></p>
                    <button class="login-btn" type="submit"><i class="fa-regular fa-paper-plane"></i> Send reset link</button>
                </form>

                <form id="passwordResetConfirmForm" novalidate hidden>
                    <label for="newPassword">New password</label>
                    <div class="input-group"><i class="fa-solid fa-lock"></i><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="At least 8 characters" required><button class="toggle-password" type="button" data-password-toggle aria-controls="newPassword" aria-label="Show new password"><i class="fa-regular fa-eye"></i></button></div>
                    <small class="password-hint">Use at least 8 characters, including a letter and a number.</small>
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="input-group"><i class="fa-solid fa-lock"></i><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Repeat your new password" required><button class="toggle-password" type="button" data-password-toggle aria-controls="confirmPassword" aria-label="Show confirm new password"><i class="fa-regular fa-eye"></i></button></div>
                    <p id="resetConfirmMessage" class="message" role="status" aria-live="polite"></p>
                    <button class="login-btn" type="submit"><i class="fa-solid fa-shield-heart"></i> Update password</button>
                </form>

                <p class="back-to-login"><a href="/login">Back to sign in</a></p>
            </div>
        </section>
    </main>
    <script src="/static/dashboard_v2/js/reset_password.js"></script>
</body>
</html>
